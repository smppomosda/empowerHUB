<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#eeeeee" />

  <!-- PWA: manifest & installability -->
  <link rel="manifest" href="./manifest.json" />

  <!-- iOS Safari: add to home screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="EMPOWER HUB" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./icons/favicon-32.png" />
  <link rel="icon" type="image/x-icon" href="./icons/favicon.ico" />
  <link rel="shortcut icon" href="./icons/favicon.ico" />

  <title>EMPOWER HUB</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden;
    }

    /* Safe area insets untuk iPhone notch / Dynamic Island */
    .iframe-container {
      width: 100%;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      box-sizing: border-box;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading splash sebelum iframe siap */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eee;
      z-index: 10;
      transition: opacity .4s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; margin-bottom: 16px; border-radius: 16px; }
    #splash .spinner {
      width: 28px; height: 28px;
      border: 3px solid #ccc; border-top-color: #444;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    #splash p { margin-top: 12px; color:#555; font-family: system-ui, sans-serif; font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash">
    <img src="./icons/icon-192.png" alt="EMPOWER HUB" />
    <div class="spinner"></div>
    <p>Memuat EMPOWER HUB…</p>
  </div>

  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbxo4exdSqse3O3KuJXX8HzphCc7ltOBYoR6p1kPXObMRDU4JIKrjiplcBbtJzj8NhPFig/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>

  <script>
    // Sembunyikan splash saat iframe selesai load
    (function () {
      const splash = document.getElementById('splash');
      const frame  = document.getElementById('app');
      const hide = () => setTimeout(() => splash.classList.add('hide'), 300);
      frame.addEventListener('load', hide);
      // Fallback: tetap sembunyikan setelah 6 detik walau load event tidak keluar (cross-origin)
      setTimeout(hide, 6000);
    })();

    // Daftarkan service worker untuk dukungan install + offline shell
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js', { scope: './' })
          .then(reg => console.log('[PWA] Service Worker terdaftar, scope:', reg.scope))
          .catch(err => console.warn('[PWA] SW gagal:', err));
      });
    }

    // Tangkap event "beforeinstallprompt" untuk tombol install manual (opsional)
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('[PWA] Siap untuk di-install. deferredPrompt tersedia.');
    });

    window.addEventListener('appinstalled', () => {
      console.log('[PWA] Aplikasi terpasang.');
      deferredPrompt = null;
    });
  </script>
</body>
</html>
